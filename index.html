<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول لنظام (ياسر ويب)</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Tahoma, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #2e1065, #5b21b6);
      padding: 16px;
      color: #111827;
    }

    .login-wrapper {
      min-height: calc(100vh - 32px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 26px;
      padding: 32px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .login-title {
      margin: 0 0 26px;
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
    }
    .login-label {
      display: block;
      text-align: right;
      font-size: 16px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 10px;
    }
    .login-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border-radius: 14px;
      border: 1.5px solid #cbd5e1;
      outline: none;
      margin-bottom: 18px;
      background: #ffffff;
      color: #111827;
    }
    .login-input:focus {
      border-color: #6d28d9;
    }
    .login-btn {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      background: #6d28d9;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    .login-btn:hover {
      background: #5b21b6;
    }
    .login-footer {
      margin-top: 26px;
      font-size: 14px;
      color: #334155;
      line-height: 1.7;
    }
    .login-footer span {
      color: #4f46e5;
      font-weight: 700;
    }

    .app-box {
      max-width: 1020px;
      margin: 0 auto;
      background: #f8fafc;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      display: none;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #ede9fe;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: bold;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .nav button {
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      background: #e2e8f0;
      color: #1e293b;
      font-size: 13px;
    }
    .nav button.active {
      background: #5b21b6;
      color: #fff;
    }
    .panel { display: none; }
    .panel.active { display: block; }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }
    .btn-purple {
      background: #6d28d9;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-green {
      background: #059669;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-red {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }
    .white-box {
      background: #fff;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    .preset-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .preset-chip {
      border: 1px solid #6d28d9;
      background: #f5f3ff;
      color: #4c1d95;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .order-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .inv-preview {
      background: #ffffff;
      padding: 18px;
      border-radius: 12px;
      min-height: 330px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 8px;
      text-align: right;
      font-size: 12px;
    }
    th { background: #312e81; color: #fff; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول: حقل فارغ تماماً بدون أي قيمة افتراضية -->
  <div id="login-screen" class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">🔒 تسجيل الدخول لنظام (ياسر ويب)</h1>
      <label class="login-label" for="login-user-input">اسم المستخدم أو المحل:</label>
      <input
        type="text"
        id="login-user-input"
        name="u_entry_clean"
        class="login-input"
        autocomplete="new-password"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button type="button" class="login-btn" onclick="loginFromScreen()">دخول للنظام</button>

      <div class="login-footer">
        <div>لطلب أو تجديد كود النسخة المدفوعة:</div>
        <div>📷 انستغرام: <span>@yaser120120120120</span></div>
      </div>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="app-screen" class="app-box">
    <div class="top-bar">
      <div>
        الحساب: <span id="lbl-user">---</span> |
        السلة: <span id="lbl-cart">0</span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" class="btn-red" onclick="clearMyStore()">تصفير بضاعتي</button>
        <button type="button" class="btn-purple" onclick="goToLoginScreen()">خروج / حساب جديد</button>
      </div>
    </div>

    <div class="nav">
      <button type="button" id="b-store" class="active" onclick="openTab('store')">المواد والسلة</button>
      <button type="button" id="b-add" onclick="openTab('add')">إضافة موادي</button>
      <button type="button" id="b-inv" onclick="openTab('inv')">تصميم وترتيب الفاتورة</button>
      <button type="button" id="b-logs" style="display:none;" onclick="openTab('logs')">سجل الدخول اليومي</button>
    </div>

    <!-- 1. المواد والسلة -->
    <div id="p-store" class="panel active">
      <input type="text" id="inp-search" placeholder="بحث عن مادة..." oninput="drawStore()" style="width:100%; padding:10px; border-radius:10px; border:1px solid #cbd5e1;" />
      <div id="store-list" class="grid-cards"></div>
    </div>

    <!-- 2. إضافة مواد المستخدم -->
    <div id="p-add" class="panel white-box">
      <h3 style="margin:0 0 10px;">إضافة مواد لهذا الحساب فقط</h3>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <input type="text" id="p-name" placeholder="اسم المادة" style="padding:8px; border-radius:8px; border:1px solid #cbd5e1;" />
        <input type="number" id="p-price" placeholder="السعر" style="width:110px; padding:8px; border-radius:8px; border:1px solid #cbd5e1;" />
        <input type="number" id="p-qty" placeholder="الكمية" value="5" style="width:90px; padding:8px; border-radius:8px; border:1px solid #cbd5e1;" />
        <button type="button" class="btn-purple" onclick="addProd()">+ إضافة</button>
      </div>
      <table>
        <thead>
          <tr><th>المادة</th><th>السعر</th><th>الكمية</th><th>حذف</th></tr>
        </thead>
        <tbody id="prod-table-body"></tbody>
      </table>
    </div>

    <!-- 3. تصميم وترتيب الفاتورة (أشكال متعددة + تخصيص وترتيب كامل) -->
    <div id="p-inv" class="panel">
      <div class="two-col">
        <div class="white-box">
          <h3 style="margin:0 0 10px;">أشكال وتصميم وترتيب الفاتورة</h3>

          <div class="preset-bar">
            <button type="button" class="preset-chip" onclick="applyInvoiceStyle('classic')">شكل كلاسيكي</button>
            <button type="button" class="preset-chip" onclick="applyInvoiceStyle('royal')">شكل ملكي ذهبي</button>
            <button type="button" class="preset-chip" onclick="applyInvoiceStyle('modern')">شكل عصري</button>
            <button type="button" class="preset-chip" onclick="applyInvoiceStyle('minimal')">شكل بسيط</button>
          </div>

          <div style="margin-bottom:8px;">
            <label style="font-size:12px; font-weight:bold; display:block;">اسم الصفحة أو المحل:</label>
            <input type="text" id="inv-shop" oninput="drawInvoice()" style="width:100%; padding:8px; border-radius:8px; border:1px solid #cbd5e1;" />
          </div>

          <div style="margin-bottom:8px;">
            <label style="font-size:12px; font-weight:bold; display:block;">صورة أو لوغو الفاتورة:</label>
            <input type="file" accept="image/*" onchange="setLogo(event)" />
          </div>

          <div style="display:flex; gap:8px; margin-bottom:10px;">
            <div style="flex:1;">
              <label style="font-size:12px; font-weight:bold; display:block;">إطار وشكل الحواف:</label>
              <select id="inv-border" onchange="drawInvoice()" style="width:100%; padding:8px; border-radius:8px; border:1px solid #cbd5e1;">
                <option value="2px solid #334155">إطار مستقيم بسيط</option>
                <option value="6px double #5b21b6">إطار كلاسيكي مزدوج</option>
                <option value="5px dashed #b45309">إطار مزخرف متقطع</option>
                <option value="7px ridge #0f766e">إطار بارز فاخر</option>
              </select>
            </div>
            <div style="flex:1;">
              <label style="font-size:12px; font-weight:bold; display:block;">حجم الخط:</label>
              <select id="inv-size" onchange="drawInvoice()" style="width:100%; padding:8px; border-radius:8px; border:1px solid #cbd5e1;">
                <option value="13px">صغير</option>
                <option value="15px" selected>متوسط</option>
                <option value="18px">كبير</option>
              </select>
            </div>
          </div>

          <div style="margin-bottom:10px;">
            <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">ترتيب أقسام الفاتورة (للأعلى أو الأسفل):</label>
            <div id="order-box"></div>
          </div>

          <div style="margin-bottom:10px;">
            <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">التوقيع:</label>
            <canvas id="sig" width="260" height="70" style="border:1px dashed #64748b; background:#fff; border-radius:8px; width:100%;"></canvas>
            <button type="button" onclick="clearSig()" style="background:none; border:none; color:#dc2626; font-size:11px; font-weight:bold; cursor:pointer;">مسح التوقيع</button>
          </div>

          <button type="button" class="btn-green" onclick="saveDesign()">حفظ تصميم الفاتورة لحسابي</button>
          <button type="button" class="btn-purple" onclick="window.print()">طباعة الفاتورة</button>
        </div>

        <div class="white-box">
          <div id="inv-sheet" class="inv-preview" style="border:2px solid #334155; font-size:15px;"></div>
        </div>
      </div>
    </div>

    <!-- 4. سجل الدخول اليومي (للأدمن فقط) -->
    <div id="p-logs" class="panel white-box">
      <h3 style="margin:0 0 10px;">سجل المستخدمين ومرات الدخول اليوم</h3>
      <table>
        <thead>
          <tr><th>اسم المستخدم</th><th>مرات الدخول اليوم</th><th>عدد المواد</th><th>آخر دخول</th></tr>
        </thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ضمان تفريغ حقل اسم المستخدم ومنع أي قيمة تلقائية عند التحميل
    (function enforceCleanLoginField() {
      const input = document.getElementById('login-user-input');
      if (!input) return;

      const clearNow = () => {
        if (document.activeElement !== input) {
          input.value = '';
        }
      };

      clearNow();
      window.addEventListener('DOMContentLoaded', clearNow);
      window.addEventListener('load', clearNow);
      window.addEventListener('pageshow', clearNow);
      setTimeout(clearNow, 50);
      setTimeout(clearNow, 250);
      setTimeout(clearNow, 600);
    })();

    const DB = {
      currentUser: '',
      users: {},
      logs: [],
      buckets: {}
    };

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }
    function nowStr() {
      return new Date().toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
    }
    function isAdmin() {
      const u = (DB.currentUser || '').trim().toLowerCase();
      return u === 'admin' || u === 'الأدمن' || u === 'الادمن';
    }

    function makeEmptyBucket(username) {
      return {
        products: [],
        cart: [],
        design: {
          shop: username,
          logo: '',
          border: '2px solid #334155',
          bgColor: '#ffffff',
          accentColor: '#312e81',
          size: '15px',
          sig: '',
          order: ['head', 'items', 'foot']
        }
      };
    }

    function getBucket(username) {
      if (!DB.buckets[username]) {
        DB.buckets[username] = makeEmptyBucket(username);
      }
      return DB.buckets[username];
    }

    function loginFromScreen() {
      const input = document.getElementById('login-user-input');
      const username = (input.value || '').trim();
      if (!username) {
        alert('اكتب اسم المستخدم أو المحل أولاً');
        return;
      }

      DB.currentUser = username;

      if (!DB.users[username]) {
        DB.users[username] = { created: todayStr() };
        DB.buckets[username] = makeEmptyBucket(username);
      }

      DB.logs.push({ user: username, date: todayStr(), time: nowStr() });

      input.value = '';
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';

      openTab('store');
      clearSigCanvasOnly();
      syncDesignFields();
      renderAll();
    }

    function goToLoginScreen() {
      DB.currentUser = '';
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      const input = document.getElementById('login-user-input');
      input.value = '';
      input.focus();
    }

    function clearMyStore() {
      if (!DB.currentUser) return;
      DB.buckets[DB.currentUser] = makeEmptyBucket(DB.currentUser);
      clearSigCanvasOnly();
      syncDesignFields();
      renderAll();
    }

    function addProd() {
      const name = document.getElementById('p-name').value.trim();
      const price = Number(document.getElementById('p-price').value);
      const qty = Number(document.getElementById('p-qty').value);
      if (!name || !price) return;
      const b = getBucket(DB.currentUser);
      b.products.push({ id: String(Date.now() + Math.random()), name, price, qty: qty || 1 });
      document.getElementById('p-name').value = '';
      document.getElementById('p-price').value = '';
      renderAll();
    }

    function delProd(id) {
      const b = getBucket(DB.currentUser);
      b.products = b.products.filter(x => x.id !== id);
      renderAll();
    }

    function addCart(id) {
      const b = getBucket(DB.currentUser);
      const item = b.products.find(x => x.id === id);
      if (!item || item.qty <= 0) return;
      item.qty -= 1;
      b.cart.push(item);
      renderAll();
    }

    function drawStore() {
      const q = (document.getElementById('inp-search').value || '').trim().toLowerCase();
      const b = getBucket(DB.currentUser);
      const list = b.products.filter(x => !q || x.name.toLowerCase().includes(q));
      const wrap = document.getElementById('store-list');
      if (!list.length) {
        wrap.innerHTML = `<div class="white-box" style="grid-column:1/-1; text-align:center;">لا توجد مواد في هذا الحساب حالياً. يمكنك إضافة موادك من تبويب "إضافة موادي".</div>`;
        return;
      }
      wrap.innerHTML = list.map(x => `
        <div class="card">
          <h4 style="margin:0 0 8px;">${x.name}</h4>
          <div>السعر: ${x.price.toLocaleString()} د.ع</div>
          <div style="margin-bottom:10px;">المتوفر: ${x.qty}</div>
          <button type="button" class="btn-purple" style="width:100%;" onclick="addCart('${x.id}')">+ إضافة</button>
        </div>
      `).join('');
    }

    function drawProdTable() {
      const b = getBucket(DB.currentUser);
      const tb = document.getElementById('prod-table-body');
      tb.innerHTML = b.products.length
        ? b.products.map(x => `<tr><td>${x.name}</td><td>${x.price}</td><td>${x.qty}</td><td><button type="button" class="btn-red" onclick="delProd('${x.id}')">حذف</button></td></tr>`).join('')
        : `<tr><td colspan="4" style="text-align:center;">لا توجد مواد</td></tr>`;
    }

    const LABELS = { head: 'رأس الفاتورة (اللوغو والاسم)', items: 'جدول المواد', foot: 'التوقيع' };

    function applyInvoiceStyle(styleKey) {
      const d = getBucket(DB.currentUser).design;
      if (styleKey === 'classic') {
        d.border = '6px double #5b21b6';
        d.bgColor = '#ffffff';
        d.accentColor = '#4c1d95';
        d.size = '15px';
      } else if (styleKey === 'royal') {
        d.border = '5px dashed #b45309';
        d.bgColor = '#fffbeb';
        d.accentColor = '#92400e';
        d.size = '16px';
      } else if (styleKey === 'modern') {
        d.border = '7px ridge #0f766e';
        d.bgColor = '#f0fdfa';
        d.accentColor = '#0f766e';
        d.size = '15px';
      } else {
        d.border = '2px solid #334155';
        d.bgColor = '#ffffff';
        d.accentColor = '#1e293b';
        d.size = '14px';
      }
      document.getElementById('inv-border').value = d.border;
      document.getElementById('inv-size').value = d.size;
      drawInvoice();
    }

    function syncDesignFields() {
      const d = getBucket(DB.currentUser).design;
      document.getElementById('inv-shop').value = d.shop;
      document.getElementById('inv-border').value = d.border;
      document.getElementById('inv-size').value = d.size;
      drawOrderList();
    }

    function drawOrderList() {
      const d = getBucket(DB.currentUser).design;
      document.getElementById('order-box').innerHTML = d.order.map((k, i) => `
        <div class="order-row">
          <span>${LABELS[k]}</span>
          <span>
            <button type="button" onclick="moveOrd(${i},-1)">↑</button>
            <button type="button" onclick="moveOrd(${i},1)">↓</button>
          </span>
        </div>
      `).join('');
    }

    function moveOrd(i, step) {
      const d = getBucket(DB.currentUser).design;
      const j = i + step;
      if (j < 0 || j >= d.order.length) return;
      [d.order[i], d.order[j]] = [d.order[j], d.order[i]];
      drawOrderList();
      drawInvoice();
    }

    function setLogo(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        getBucket(DB.currentUser).design.logo = ev.target.result;
        drawInvoice();
      };
      r.readAsDataURL(f);
    }

    function drawInvoice() {
      const b = getBucket(DB.currentUser);
      const d = b.design;
      d.shop = document.getElementById('inv-shop').value || DB.currentUser;
      d.border = document.getElementById('inv-border').value;
      d.size = document.getElementById('inv-size').value;

      const sheet = document.getElementById('inv-sheet');
      sheet.style.border = d.border;
      sheet.style.backgroundColor = d.bgColor || '#ffffff';
      sheet.style.fontSize = d.size;

      const total = b.products.reduce((sum, x) => sum + (Number(x.price) || 0), 0);
      const rows = b.products.length
        ? b.products.map(p => `<tr><td>${p.name}</td><td>${Number(p.price).toLocaleString()} د.ع</td></tr>`).join('')
        : `<tr><td colspan="2" style="text-align:center;">لا توجد مواد</td></tr>`;

      const parts = {
        head: `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid ${d.accentColor || '#312e81'}; padding-bottom:8px;">
          <div style="display:flex; align-items:center; gap:8px;">
            ${d.logo ? `<img src="${d.logo}" style="width:45px; height:45px; object-fit:contain;" />` : ''}
            <strong style="color:${d.accentColor || '#312e81'};">${d.shop}</strong>
          </div>
          <small>${todayStr()}</small>
        </div>`,
        items: `<div>
          <table><thead><tr><th>المادة</th><th>السعر</th></tr></thead><tbody>${rows}</tbody></table>
          <div style="text-align:left; margin-top:8px; font-weight:bold; color:${d.accentColor || '#312e81'};">المجموع: ${total.toLocaleString()} د.ع</div>
        </div>`,
        foot: `<div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:auto; border-top:1px dashed #cbd5e1; padding-top:8px;">
          <small>فاتورة: ${d.shop}</small>
          <div style="text-align:center;">
            ${d.sig ? `<img src="${d.sig}" style="height:36px; display:block; margin:0 auto;" />` : ''}
            <small>التوقيع</small>
          </div>
        </div>`
      };

      sheet.innerHTML = d.order.map(k => parts[k]).join('');
    }

    function saveDesign() {
      drawInvoice();
      alert('تم حفظ تصميم الفاتورة لحساب ' + DB.currentUser);
    }

    const cv = document.getElementById('sig');
    const cx = cv.getContext('2d');
    let down = false;
    cx.lineWidth = 2;
    cv.addEventListener('pointerdown', e => { down = true; cx.beginPath(); cx.moveTo(e.offsetX, e.offsetY); });
    cv.addEventListener('pointermove', e => { if (down) { cx.lineTo(e.offsetX, e.offsetY); cx.stroke(); } });
    window.addEventListener('pointerup', () => {
      if (down && DB.currentUser) {
        down = false;
        getBucket(DB.currentUser).design.sig = cv.toDataURL();
        drawInvoice();
      }
    });
    function clearSigCanvasOnly() {
      cx.clearRect(0, 0, cv.width, cv.height);
    }
    function clearSig() {
      clearSigCanvasOnly();
      if (DB.currentUser) {
        getBucket(DB.currentUser).design.sig = '';
        drawInvoice();
      }
    }

    function drawLogs() {
      if (!isAdmin()) {
        document.getElementById('logs-body').innerHTML = '';
        return;
      }
      const tb = document.getElementById('logs-body');
      tb.innerHTML = Object.keys(DB.users).map(u => {
        const dayLogs = DB.logs.filter(l => l.user === u && l.date === todayStr());
        const last = dayLogs.length ? dayLogs[dayLogs.length - 1].time : '-';
        const cnt = (DB.buckets[u] && DB.buckets[u].products.length) || 0;
        return `<tr><td><strong>${u}</strong></td><td>${dayLogs.length}</td><td>${cnt}</td><td>${last}</td></tr>`;
      }).join('');
    }

    function syncAdminTab() {
      const btn = document.getElementById('b-logs');
      const panel = document.getElementById('p-logs');
      if (isAdmin()) {
        btn.style.display = 'inline-block';
      } else {
        btn.style.display = 'none';
        panel.classList.remove('active');
        btn.classList.remove('active');
        document.getElementById('logs-body').innerHTML = '';
      }
    }

    function openTab(name) {
      if (name === 'logs' && !isAdmin()) return;
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('p-' + name).classList.add('active');
      document.getElementById('b-' + name).classList.add('active');
    }

    function renderAll() {
      if (!DB.currentUser) return;
      const b = getBucket(DB.currentUser);
      document.getElementById('lbl-user').textContent = DB.currentUser;
      document.getElementById('lbl-cart').textContent = b.cart.length;
      syncAdminTab();
      drawStore();
      drawProdTable();
      drawInvoice();
      drawLogs();
    }
  </script>
</body>
</html>
