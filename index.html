<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة المستخدمين وسجلات الدخول</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button.ban { background: #dc3545; }
        button.unban { background: #28a745; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        .section-divider { border: 0; height: 2px; background: #ff9800; margin: 30px 0; }
    </style>
</head>
<body>

<div class="container">

    <!-- ================================================================= -->
    <!-- [الخانة الأولى]: واجهة ونموذج تسجيل الدخول (Login View & Logic) -->
    <!-- ================================================================= -->
    <h2>تسجيل الدخول للنظام</h2>
    <div id="login-section">
        <input type="text" id="username" placeholder="اسم المستخدم (مثال: ياسر أو أي اسم)">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="handleLogin()">دخول</button>
    </div>

    <hr class="section-divider">

    <!-- ================================================================= -->
    <!-- [الخانة الثانية]: منطق التحقق من الحساب والحظر (Authentication Check) -->
    <!-- ================================================================= -->
    <!-- (هنا يتم التحقق برمجياً من حالة الحظر قبل السماح بالدخول) -->


    <!-- ================================================================= -->
    <!-- [الخانة الثالثة]: إدارة وتخزين الجلسات وسجلات الدخول (Session Logs) -->
    <!-- ================================================================= -->
    <div id="admin-dashboard" style="display:none;">
        <h2>لوحة التحكم - سجلات العملاء والدخول</h2>
        <p>مرحباً بك يا أدمن (<span id="admin-name"></span>)</p>
        <button onclick="logout()" style="background:#6c757d;">تسجيل خروج</button>

        <table>
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>وقت وتاريخ آخر دخول</th>
                    <th>عدد مرات الدخول</th>
                    <th>حالة الحساب</th>
                    <th>الإجراء (حظر / تفعيل)</th>
                </tr>
            </thead>
            <tbody id="logs-table-body">
                <!-- يتم تعبئة السجلات هنا تلقائياً -->
            </tbody>
        </table>
    </div>

    <!-- هنا تبقي بقية الـ 11 خانة الخاصة بمشروعك مقسمة بنفس الطريقة بين الخطوط الفاصلة -->

</div>

<script>
    /* ================================================================= */
    /* [الخانة الرابعة]: جافاسكريبت - معالجة البيانات والتخزين المحلي      */
    /* ================================================================= */

    // دالة تسجيل الدخول وفحص الحظر وحفظ السجلات والوقت والمرات
    function handleLogin() {
        const uInput = document.getElementById('username').value.trim();
        const pInput = document.getElementById('password').value.trim();

        if(!uInput) {
            alert('الرجاء كتابة اسم المستخدم');
            return;
        }

        let usersDB = JSON.parse(localStorage.getItem('system_users_db')) || {};

        // فحص إذا كان المستخدم محظوراً
        if(usersDB[uInput] && usersDB[uInput].status === 'banned') {
            alert('عذراً، هذا الحساب محظور من قبل الإدارة!');
            return;
        }

        // تسجيل أو تحديث بيانات الدخول (الوقت والمرات)
        const now = new Date().toLocaleString('ar-IQ');
        
        if(!usersDB[uInput]) {
            usersDB[uInput] = {
                count: 1,
                lastLogin: now,
                status: 'active',
                role: (uInput === 'ياسر' ? 'admin' : 'user')
            };
        } else {
            usersDB[uInput].count += 1;
            usersDB[uInput].lastLogin = now;
        }

        localStorage.setItem('system_users_db', JSON.stringify(usersDB));
        localStorage.setItem('current_user', uInput);

        checkSession();
    }

    /* ================================================================= */
    /* [الخانة الخامسة]: جافاسكريبت - إدارة لوحة التحكم وعرض السجلات     */
    /* ================================================================= */

    function checkSession() {
        const currentUser = localStorage.getItem('current_user');
        if(!currentUser) return;

        let usersDB = JSON.parse(localStorage.getItem('system_users_db')) || {};
        const userData = usersDB[currentUser];

        if(userData && userData.role === 'admin') {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            document.getElementById('admin-name').innerText = currentUser;
            renderLogsTable();
        } else {
            alert('تم تسجيل الدخول بنجاح للمستخدم العادي!');
        }
    }

    /* ================================================================= */
    /* [الخانة السادسة]: جافاسكريبت - جدول مراقبة الحضور وحظر المستخدمين    */
    /* ================================================================= */

    function renderLogsTable() {
        let usersDB = JSON.parse(localStorage.getItem('system_users_db')) || {};
        const tbody = document.getElementById('logs-table-body');
        tbody.innerHTML = '';

        for(let username in usersDB) {
            let data = usersDB[username];
            let tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${username}</td>
                <td>${data.lastLogin}</td>
                <td>${data.count} مرات</td>
                <td>${data.status === 'active' ? 'نشط' : 'محظور'}</td>
                <td>
                    ${data.status === 'active' ? 
                        `<button class="ban" onclick="toggleBan('${username}', 'banned')">حظر</button>` : 
                        `<button class="unban" onclick="toggleBan('${username}', 'active')">رفع الحظر</button>`
                    }
                </td>
            `;
            tbody.appendChild(tr);
        }
    }

    function toggleBan(username, newStatus) {
        let usersDB = JSON.parse(localStorage.getItem('system_users_db')) || {};
        if(usersDB[username]) {
            usersDB[username].status = newStatus;
            localStorage.setItem('system_users_db', JSON.stringify(usersDB));
            renderLogsTable();
        }
    }

    function logout() {
        localStorage.removeItem('current_user');
        location.reload();
    }

    // التحقق المباشر عند فتح الصفحة
    window.onload = function() {
        if(localStorage.getItem('current_user')) {
            checkSession();
        }
    }
</script>

</body>
</html>
