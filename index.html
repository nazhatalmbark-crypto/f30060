<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ياسر ويب - YASSER WEB</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة لطباعة وتصدير PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #553c9a 0%, #3b2375 100%);
            direction: rtl;
            text-align: right;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .mobile-container {
            width: 100%;
            max-width: 420px;
            background: #f8f6fc;
            border-radius: 32px;
            padding: 25px 18px;
            margin: 15px auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            border: 6px solid #2d1a4e;
            box-sizing: border-box;
            color: #2d1a4e;
        }
        h1, h2, h3, h4, p, label {
            color: #2d1a4e;
            font-weight: 600;
        }
        input, select, textarea {
            color: #000000 !important;
            background: #ffffff !important;
            border: 1px solid #dcd6f7 !important;
            border-radius: 12px !important;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            text-align: right;
            direction: rtl;
            font-size: 14px;
        }
        button, .btn {
            background-color: #6b46c1;
            color: white;
            border-radius: 12px;
            border: none;
            padding: 10px 14px;
            font-weight: bold;
            width: 100%;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(107, 70, 193, 0.2);
            cursor: pointer;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        button:hover, .btn:hover {
            background-color: #483185;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2d9f3;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2d9f3;
            padding-bottom: 10px;
        }
        .alert-warning { background: #fff3cd; color: #856404; padding: 8px; border-radius: 8px; font-size: 12px; margin-bottom: 8px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="mobile-container" id="app">
    <!-- شاشة التحميل -->
    <div id="loading-screen" style="text-align: center; padding: 50px 0;">
        <h3>جاري تحميل نظام ياسر ويب...</h3>
        <p style="font-size: 12px; color: #7c6f9f;">Static Web 15.0.0</p>
    </div>

    <!-- تسجيل الدخول -->
    <div id="login-screen" class="hidden">
        <h3 style="text-align: center; margin-bottom: 20px;">🔐 تسجيل الدخول لنظام (ياسر ويب)</h3>
        <label>اسم المستخدم أو المحل:</label>
        <input type="text" id="login-username" value="ياسر" placeholder="أدخل اسم المستخدم...">
        
        <button onclick="handleLogin()">دخول للنظام</button>
        <div style="text-align: center; margin-top: 15px; font-size: 12px;">
            لطلب أو تجديد كود النسخة المدفوعة: <br>
            <a href="https://instagram.com/yaser120120120120" target="_blank" style="color: #6b46c1; font-weight: bold; text-decoration: none;">📸 انستغرام: @yaser120120120120</a>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="main-app" class="hidden">
        <div id="subscription-banner" style="background: #2f855a; color: white; padding: 6px; border-radius: 8px; text-align: center; font-size: 11px; margin-bottom: 10px; font-weight: bold;"></div>
        
        <div class="top-bar">
            <button id="back-btn" class="hidden" onclick="goToPage('home')" style="width: auto; padding: 6px 12px;">⬅️ رجوع</button>
            <span id="app-title" style="font-weight: bold; font-size: 15px;">ياسر ويب</span>
            <div>
                <button onclick="goToPage('cart')" style="width: auto; padding: 6px 12px; background: #2b6cb0;">🛒 <span id="cart-badge">0</span></button>
                <button onclick="handleLogout()" style="width: auto; padding: 6px 12px; background: #c53030;">خروج</button>
            </div>
        </div>

        <div id="view-content"></div>
        
        <div style="text-align: center; margin-top: 20px; font-size: 11px; color: #7c6f9f;">
            ياسر ويب - تطوير ودعم: <a href="https://instagram.com/yaser120120120120" target="_blank" style="color: #6b46c1; text-decoration: none;">@yaser120120120120</a>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://mdffzniutjcjnytuoakb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PjzQyJU_n-4pFdLZV7os6w_gLt78fLp";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = localStorage.getItem("yasser_user") || "ياسر";
    let cart = JSON.parse(localStorage.getItem("yasser_cart")) || [];
    
    let productsList = [];
    let customersList = [];
    let invoicesList = [];

    function checkSubscriptionStatus() {
        let subExpireDate = localStorage.getItem("yasser_sub_expire");
        let isVip = localStorage.getItem("yasser_is_vip") === "true";

        if (!isVip || !subExpireDate) {
            return { type: "مجانية", daysLeft: 0, active: true };
        }

        let now = new Date().getTime();
        let expire = parseInt(subExpireDate);
        let diffDays = Math.ceil((expire - now) / (1000 * 60 * 60 * 24));

        if (diffDays <= 0) {
            return { type: "مجانية (انتهت المدفوعة)", daysLeft: 0, active: true };
        }
        return { type: "مدفوعة", daysLeft: diffDays, active: true };
    }

    window.onload = async () => {
        document.getElementById("loading-screen").classList.add("hidden");
        await loadAppData();
        
        if (!currentUser) {
            document.getElementById("login-screen").classList.remove("hidden");
        } else {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-app").classList.remove("hidden");
            updateBanner();
            goToPage("home");
        }
    };

    function updateBanner() {
        const sub = checkSubscriptionStatus();
        const banner = document.getElementById("subscription-banner");
        if (sub.type === "مدفوعة") {
            banner.style.background = "#2f855a";
            banner.innerHTML = `🌟 النسخة المدفوعة مفعلة | متبقي من الاشتراك: <b>${sub.daysLeft} يوم</b>`;
        } else {
            banner.style.background = "#b7791f";
            banner.innerHTML = `⚠️ أنت تستخدم النسخة المجانية المحدودة. <a href="#" onclick="goToPage('activation_page')" style="color:#fff; text-decoration:underline;">أدخل كود التفعيل هنا</a>`;
        }
    }

    function handleLogin() {
        const usernameInput = document.getElementById("login-username").value.trim() || "ياسر";
        currentUser = usernameInput;
        localStorage.setItem("yasser_user", currentUser);

        loadAppData();
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("main-app").classList.remove("hidden");
        updateBanner();
        goToPage("home");
    }

    function handleLogout() {
        localStorage.removeItem("yasser_cart");
        document.getElementById("main-app").classList.add("hidden");
        document.getElementById("login-screen").classList.remove("hidden");
    }

    async function loadAppData() {
        if (!currentUser) currentUser = "ياسر";
        try {
            const pRes = await supabaseClient.from("products").select("*");
            if (!pRes.error) productsList = pRes.data || [];
            
            const cRes = await supabaseClient.from("customers").select("*");
            if (!cRes.error) customersList = cRes.data || [];
            
            const iRes = await supabaseClient.from("invoices").select("*");
            if (!iRes.error) invoicesList = iRes.data || [];
        } catch (e) { 
            console.log(e); 
        }
    }

    function updateCartBadge() {
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById("cart-badge").innerText = totalQty;
        localStorage.setItem("yasser_cart", JSON.stringify(cart));
    }

    async function goToPage(page) {
        await loadAppData();
        updateBanner();
        updateCartBadge();
        const content = document.getElementById("view-content");
        const backBtn = document.getElementById("back-btn");
        
        if (page === "home") {
            backBtn.classList.add("hidden");
            document.getElementById("app-title").innerText = "ياسر ويب - الرئيسية";
            renderHome(content);
        } else {
            backBtn.classList.remove("hidden");
            if (page === "grid") { renderGrid(content); }
            else if (page === "cart") { renderCart(content); }
            else if (page === "add_product") { renderAddProduct(content); }
            else if (page === "add_stock") { renderAddStock(content); }
            else if (page === "inventory") { renderInventory(content); }
            else if (page === "customers") { renderCustomers(content); }
            else if (page === "suppliers") { content.innerHTML = `<p style="text-align:center;">إدارة الموردين قيد التشغيل.</p>`; }
            else if (page === "expenses") { content.innerHTML = `<p style="text-align:center;">الصندوق قيد التشغيل.</p>`; }
            else if (page === "invoices") { renderInvoices(content); }
            else if (page === "reports") { renderReports(content); }
            else if (page === "guide") { renderGuide(content); }
            else if (page === "activation_page") { renderActivationPage(content); }
            else if (page === "admin_panel") { renderAdminPanel(content); }
        }
    }

    function renderHome(container) {
        const todayStr = new Date().toISOString().split('T')[0];
        const todayInvs = invoicesList.filter(inv => inv.created_date && inv.created_date.startsWith(todayStr));
        const todaySales = todayInvs.reduce((sum, inv) => sum + (inv.total_price || 0), 0);

        // هل المستخدم هو الأدمن ياسر؟ نظهر له لوحة التحكم الخاصة بالأدمن
        let adminCardHTML = "";
        if (currentUser === "ياسر" || currentUser === "yasser_admin") {
            adminCardHTML = `
                <div class="card" onclick="goToPage('admin_panel')" style="cursor:pointer; text-align:center; background:#fff5f5; border: 2px dashed #c53030; grid-column: span 2;">
                    <h4 style="color:#c53030; margin:5px 0;">👑 لوحة تحكم الأدمن (توليد الأكواد)</h4>
                    <p style="font-size:11px; margin:0;">إدارة وتوليد أكواد الاشتراكات الشهرية للزبائن</p>
                </div>
            `;
        }

        container.innerHTML = `
            <div class="card" style="background: #f3e8ff; text-align: center;">
                <p style="margin: 0; font-size: 13px;">📊 إحصائيات اليوم: مبيعات: <b>${todaySales.toLocaleString()} د.ع</b> | الفواتير: <b>${todayInvs.length}</b></p>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                ${adminCardHTML}
                <div class="card" onclick="goToPage('grid')" style="cursor:pointer; text-align:center;">
                    <h4>🏠 الرئيسية والشبكة</h4>
                    <p style="font-size:11px;">الضغطة السريعة للبيع</p>
                </div>
                <div class="card" onclick="goToPage('add_product')" style="cursor:pointer; text-align:center;">
                    <h4>➕ إضافة مادة جديدة</h4>
                    <p style="font-size:11px;">مادة لأول مرة للمخزن</p>
                </div>
                <div class="card" onclick="goToPage('add_stock')" style="cursor:pointer; text-align:center; background:#e6fffa;">
                    <h4>📦 إضافة كمية لمادة</h4>
                    <p style="font-size:11px;">زيادة رصيد مادة قديمة</p>
                </div>
                <div class="card" onclick="goToPage('inventory')" style="cursor:pointer; text-align:center;">
                    <h4>📦 جرد المخزن</h4>
                    <p style="font-size:11px;">رصيد المواد الحالي</p>
                </div>
                <div class="card" onclick="goToPage('customers')" style="cursor:pointer; text-align:center;">
                    <h4>👥 العملاء والديون</h4>
                    <p style="font-size:11px;">إدارة الزبائن والذمم</p>
                </div>
                <div class="card" onclick="goToPage('suppliers')" style="cursor:pointer; text-align:center;">
                    <h4>🏭 إدارة الموردين</h4>
                    <p style="font-size:11px;">موردين البضاعة</p>
                </div>
                <div class="card" onclick="goToPage('expenses')" style="cursor:pointer; text-align:center;">
                    <h4>💰 الصندوق والمصاريف</h4>
                    <p style="font-size:11px;">سندات الصرف</p>
                </div>
                <div class="card" onclick="goToPage('invoices')" style="cursor:pointer; text-align:center;">
                    <h4>📄 سجل الفواتير</h4>
                    <p style="font-size:11px;">قائمة الفواتير والواتساب</p>
                </div>
                <div class="card" onclick="goToPage('reports')" style="cursor:pointer; text-align:center;">
                    <h4>📊 التقارير والأرباح</h4>
                    <p style="font-size:11px;">الحسابات المالية</p>
                </div>
                <div class="card" onclick="goToPage('activation_page')" style="cursor:pointer; text-align:center; background:#e6fffa;">
                    <h4>🔑 تفعيل النسخة المدفوعة</h4>
                    <p style="font-size:11px;">حقل إدخال كود الاشتراك الشهري</p>
                </div>
                <div class="card" onclick="goToPage('guide')" style="cursor:pointer; text-align:center; background:#fffaf0; grid-column: span 2;">
                    <h4>📖 دليل المستخدم والفرق بين النسخ</h4>
                    <p style="font-size:11px;">شرح تفصيلي لكافة الخانات والنسخ المجانية والمدفوعة</p>
                </div>
            </div>
        `;
    }

    // لوحة تحكم الأدمن لتوليد الأكواد وإدارتها
    function renderAdminPanel(container) {
        document.getElementById("app-title").innerText = "لوحة تحكم الأدمن";
        let generatedCodes = JSON.parse(localStorage.getItem("yasser_admin_codes")) || ["YASSER-VIP-2026"];
        
        container.innerHTML = `
            <div class="card" style="background:#fff; line-height:1.6; font-size:13px;">
                <h3 style="color:#c53030; margin-top:0; text-align:center;">👑 لوحة الأدمن لتوليد الأكواد</h3>
                <p>من هنا يمكنك توليد أكواد اشتراك شهرية جديدة وإعطائها للزبائن المشتركين:</p>
                
                <button onclick="generateNewVipCode()" style="background:#c53030; font-size:15px; padding:12px; margin-bottom:15px;">⚡ توليد كود اشتراك جديد</button>
                
                <h4 style="color:#2d1a4e;">📋 قائمة الأكواد الفعالة في نظامك:</h4>
                <div style="background:#f8f6fc; padding:10px; border-radius:12px; max-height:200px; overflow-y:auto;">
                    ${generatedCodes.map(code => `<div style="background:#fff; padding:8px; margin-bottom:5px; border-radius:8px; border:1px solid #dcd6f7; display:flex; justify-content:space-between; align-items:center;">
                        <span>🔑 <b>${code}</b></span>
                        <span style="font-size:10px; color:#2f855a; font-weight:bold;">نشط لمدة 30 يوم</span>
                    </div>`).join('')}
                </div>
            </div>
        `;
    }

    function generateNewVipCode() {
        let randomNum = Math.floor(1000 + Math.random() * 9000);
        let newCode = `YASSER-VIP-${randomNum}`;
        
        let codes = JSON.parse(localStorage.getItem("yasser_admin_codes")) || ["YASSER-VIP-2026"];
        codes.push(newCode);
        localStorage.setItem("yasser_admin_codes", JSON.stringify(codes));
        
        alert(`✅ تم توليد كود جديد بنجاح:\n${newCode}\n\nيمكنك نسخه وإرساله للزبون المشترك!`);
        renderAdminPanel(document.getElementById("view-content"));
    }

    // واجهة تفعيل الكود والنسخة المدفوعة مباشرة داخل القائمة
    function renderActivationPage(container) {
        document.getElementById("app-title").innerText = "تفعيل النسخة المدفوعة";
        container.innerHTML = `
            <div class="card" style="background:#fff; line-height:1.6; font-size:13px;">
                <h3 style="color:#6b46c1; margin-top:0; text-align:center;">🔑 بوابة التفعيل والاشتراك الشهري</h3>
                <p>أدخل هنا كود الاشتراك الخاص بك لتفعيل النسخة المدفوعة لمدة 30 يوماً كاملة والاستمتاع بكافة مميزات النظام:</p>
                
                <label>كود التفعيل الشهري:</label>
                <input type="text" id="main-activation-input" placeholder="أدخل الكود هنا...">
                <button onclick="applyActivationCode()" style="background:#2f855a; font-size:15px; padding:12px;">✅ تفعيل الاشتراك الآن</button>
                
                <hr style="border:0; border-top:1px solid #e2d9f3; margin:15px 0;">
                
                <div style="text-align:center; background:#f8f6fc; padding:10px; border-radius:12px;">
                    <p style="margin:0; font-weight:bold;">للحصول على كود اشتراك جديد:</p>
                    <a href="https://instagram.com/yaser120120120120" target="_blank" style="display:inline-block; margin-top:5px; color:#fff; background:#6b46c1; padding:8px 15px; border-radius:8px; text-decoration:none; font-weight:bold;">📸 انستغرام: @yaser120120120120</a>
                </div>
            </div>
        `;
    }

    function applyActivationCode() {
        const codeInput = document.getElementById("main-activation-input").value.trim();
        if (!codeInput) return;

        let usedCodes = JSON.parse(localStorage.getItem("yasser_used_codes")) || [];
        let validCodes = JSON.parse(localStorage.getItem("yasser_admin_codes")) || ["YASSER-VIP-2026"];

        if (validCodes.includes(codeInput)) {
            if (usedCodes.includes(codeInput)) {
                alert("⚠️ عذراً، هذا الكود تم استخدامه مسبقاً وانتهت صلاحيته! يرجى التواصل عبر انستغرام للحصول على كود جديد لشهر جديد.");
            } else {
                usedCodes.push(codeInput);
                localStorage.setItem("yasser_used_codes", JSON.stringify(usedCodes));
                
                let expireTime = new Date().getTime() + (30 * 24 * 60 * 60 * 1000);
                localStorage.setItem("yasser_is_vip", "true");
                localStorage.setItem("yasser_sub_expire", expireTime.toString());
                alert("✅ تم تفعيل النسخة المدفوعة بنجاح لمدة 30 يوماً!");
                goToPage("home");
            }
        } else {
            alert("❌ كود التفعيل غير صحيح!");
        }
    }

    // دليل المستخدم المفصل والشامل لشرح الفرق بين النسختين والخانَات
    function renderGuide(container) {
        document.getElementById("app-title").innerText = "دليل المستخدم والفرق بين النسخ";
        container.innerHTML = `
            <div class="card" style="background:#fff; line-height:1.6; font-size:13px;">
                <h3 style="color:#6b46c1; margin-top:0; text-align:center;">🌟 دليل استخدام نظام ياسر ويب</h3>
                
                <div style="background:#f3e8ff; padding:12px; border-radius:12px; margin-bottom:15px;">
                    <h4 style="color:#2d1a4e; margin-top:0;">💎 الفرق بين النسخة المجانية والنسخة المدفوعة</h4>
                    <p><b>1️⃣ النسخة المجانية:</b> تتيح لك فتح النظام وتجربته بشكل مباشر ومبسط، مع حدود أساسية في إدارة المتجر ومعرفة كفاءة التطبيق.</p>
                    <p><b>2️⃣ النسخة المدفوعة (الاشتراك الشهري):</b> تمنحك الصلاحيات الكاملة والمفتوحة بدون أي قيود، مع عداد تنازلي ومميزات متقدمة ودعم فني مستمر.</p>
                    <p style="color:#2f855a; font-weight:bold; margin-bottom:0;">📌 أمان تام لبياناتك: عند انتهاء اشتراك الشهر وحاولت إدخال نفس الكود القديم سيرفضه النظام، لكن بضاعتك وزبائنك وفواتيرك تظل محفوظة في السحابة ولن تنحذف أبداً، وكل ما عليك هو مراسلتي للحصول على كود جديد لشهر جديد!</p>
                </div>

                <h4 style="color:#2d1a4e;">🛠️ شرح تفصيلي لخانات وأقسام النظام:</h4>
                <p><b>• الرئيسية والشبكة:</b> تظهر فيها المواد المعروضة مع أسعارها والكميات، وتستطيع إضافة أي مادة للسلة بنقرة واحدة.</p>
                <p><b>• إضافة مادة جديدة:</b> مخصصة لإدخال أي صنف جديد كلياً للمخزن (اسم المادة، سعر الشراء، سعر البيع، الكمية).</p>
                <p><b>• إضافة كمية لمادة:</b> خاصة بالمخزن القديم؛ تختار المادة المخزنة وتزود كميتها ورصيدها مباشرة بدون إعادة كتابة اسمها.</p>
                <p><b>• جرد المخزن:</b> جدول تفصيلي يوضح كل المواد المتوفرة في المخزن وأسعارها بدقة.</p>
                <p><b>• العملاء والديون:</b> لتسجيل بيانات الزبائن (الاسم، الهاتف، المحافظة، العنوان) ومتابعة ديونهم.</p>
                <p><b>• سجل الفواتير:</b> تعرض كل الفواتير الصادرة، مع خيار تحميل الفاتورة بصيغة PDF أو إرسالها للزبون عبر الواتساب.</p>
                <p><b>• التقارير والأرباح:</b> لعرض إجمالي المبيعات والأرباح العامة للمتجر.</p>
                <p><b>• تفعيل النسخة المدفوعة:</b> الحقل المخصص لإدخال كود الاشتراك الشهري الخاص بك.</p>
                <p><b>• لوحة تحكم الأدمن:</b> خاصة بك لتوليد وإدارة أكواد الاشتراكات الشهرية للزبائن.</p>

                <hr style="border:0; border-top:1px solid #e2d9f3; margin:15px 0;">
                
                <div style="text-align:center; background:#f8f6fc; padding:10px; border-radius:12px;">
                    <p style="margin:0; font-weight:bold;">لطلب أو تجديد كود النسخة المدفوعة:</p>
                    <a href="https://instagram.com/yaser120120120120" target="_blank" style="display:inline-block; margin-top:5px; color:#fff; background:#6b46c1; padding:8px 15px; border-radius:8px; text-decoration:none; font-weight:bold;">📸 انستغرام: @yaser120120120120</a>
                </div>
            </div>
        `;
    }

    function renderGrid(container) {
        document.getElementById("app-title").innerText = "شبكة المواد السريعة";
        let html = `
            <input type="text" id="search-box" placeholder="🔍 بحث سريع عن مادة..." oninput="filterProducts(this.value)">
            <div id="products-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        `;
        productsList.forEach((item) => {
            html += `
                <div class="card" style="margin-bottom:0; text-align:center;">
                    <h4 style="margin:5px 0;">📦 ${item.product_name}</h4>
                    <p style="margin:2px 0; font-size:12px;">السعر: <b>${Number(item.sell_price).toLocaleString()}</b> د.ع</p>
                    <p style="margin:2px 0; font-size:12px;">المتوفر: <b>${item.quantity}</b></p>
                    ${item.quantity <= 3 && item.quantity > 0 ? '<div class="alert-warning">⚠️ وشك النفاد!</div>' : ''}
                    ${item.quantity > 0 ? `<button onclick='addToCart(${JSON.stringify(item)})'>➕ إضافة</button>` : '<button disabled style="background:#ccc;">نفدت الكمية</button>'}
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    function filterProducts(query) {
        const filtered = productsList.filter(i => i.product_name.toLowerCase().includes(query.toLowerCase()));
        const grid = document.getElementById("products-grid");
        let html = "";
        filtered.forEach(item => {
            html += `
                <div class="card" style="margin-bottom:0; text-align:center;">
                    <h4 style="margin:5px 0;">📦 ${item.product_name}</h4>
                    <p style="margin:2px 0; font-size:12px;">السعر: <b>${Number(item.sell_price).toLocaleString()}</b> د.ع</p>
                    <p style="margin:2px 0; font-size:12px;">المتوفر: <b>${item.quantity}</b></p>
                    <button onclick='addToCart(${JSON.stringify(item)})'>➕ إضافة</button>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    function addToCart(item) {
        let found = cart.find(c => c.product_name === item.product_name);
        if (found) {
            if (found.qty < item.quantity) found.qty++;
        } else {
            cart.push({ ...item, qty: 1, max_qty: item.quantity });
        }
        updateCartBadge();
        goToPage('grid');
    }

    function renderCart(container) {
        document.getElementById("app-title").innerText = "سلة البيع وإتمام الفاتورة";
        if (cart.length === 0) {
            container.innerHTML = `<p style="text-align:center;">🛒 السلة فارغة حالياً. أضف مواد من الرئيسية.</p>`;
            return;
        }

        let subtotal = 0;
        let html = ``;
        cart.forEach((item, idx) => {
            let itemSum = item.sell_price * item.qty;
            subtotal += itemSum;
            html += `
                <div class="card">
                    <b>${item.product_name}</b>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                        <span>العدد: <input type="number" min="1" max="${item.max_qty}" value="${item.qty}" onchange="updateQty(${idx}, this.value)" style="width:60px; display:inline-block; margin:0;"></span>
                        <span>المجموع: <b>${itemSum.toLocaleString()}</b> د.ع</span>
                        <button onclick="removeFromCart(${idx})" style="width:auto; background:#c53030; padding:5px 10px; margin:0;">❌</button>
                    </div>
                </div>
            `;
        });

        html += `
            <hr>
            <p>المجموع الفرعي: <b id="subtotal-val">${subtotal.toLocaleString()}</b> د.ع</p>
            <label>مربع الخصم (قيمة الخصم د.ع):</label>
            <input type="number" id="discount-val" value="0" oninput="calculateGrandTotal(${subtotal})">
            
            <h3 style="margin:5px 0;">المجموع الكلي النهائي: <span id="grand-total-val">${subtotal.toLocaleString()}</span> د.ع</h3>
            
            <label>اختر اسم العميل:</label>
            <select id="selected-customer">
                ${customersList.map(c => `<option value="${c.customer_name}">${c.customer_name} - ${c.phone} (${c.governorate})</option>`).join('')}
            </select>
            
            <label>المبلغ الواصل (نقد أو 0 للأقساط):</label>
            <input type="number" id="paid-amount" value="${subtotal}" oninput="calcRemaining()">
            <p id="calc-result" style="font-size:13px; font-weight:bold; color:#2b6cb0;"></p>
            
            <button onclick="checkout(${subtotal})" style="background:#2f855a; font-size:16px; padding:12px;">💾 إتمام وحفظ البيع وطباعة الفاتورة</button>
        `;
        container.innerHTML = html;
        calcRemaining();
    }

    function updateQty(idx, val) {
        cart[idx].qty = parseInt(val);
        goToPage('cart');
    }

    function removeFromCart(idx) {
        cart.splice(idx, 1);
        goToPage('cart');
    }

    function calculateGrandTotal(subtotal) {
        const discount = parseFloat(document.getElementById("discount-val").value) || 0;
        let finalTotal = Math.max(0, subtotal - discount);
        document.getElementById("grand-total-val").innerText = finalTotal.toLocaleString();
        document.getElementById("paid-amount").value = finalTotal;
        calcRemaining();
    }

    function calcRemaining() {
        const finalTotal = parseFloat(document.getElementById("grand-total-val").innerText.replace(/,/g, '')) || 0;
        const paid = parseFloat(document.getElementById("paid-amount").value) || 0;
        const rem = Math.max(0, finalTotal - paid);
        let resText = `المتبقي (الدين): ${rem.toLocaleString()} د.ع`;
        if (paid > finalTotal) {
            resText += ` | الباقي المستحق للزبون: ${(paid - finalTotal).toLocaleString()} د.ع`;
        }
        document.getElementById("calc-result").innerText = resText;
    }

    async function checkout(subtotal) {
        const custName = document.getElementById("selected-customer").value;
        if (!custName) return;
        
        const discountVal = parseFloat(document.getElementById("discount-val").value) || 0;
        const finalTotal = Math.max(0, subtotal - discountVal);
        const paidVal = parseFloat(document.getElementById("paid-amount").value) || 0;
        const remVal = Math.max(0, finalTotal - paidVal);
        let payStatus = paidVal >= finalTotal ? "🟢 نقد (كاش)" : (paidVal === 0 ? "🔴 دين كامل (آجل)" : "🔵 دفعة جزئية");

        let prodStrList = [];
        let totalCostInv = 0;
        for (let item of cart) {
            prodStrList.push(`${item.product_name} [العدد: ${item.qty}]`);
            totalCostInv += (item.buy_price || 0) * item.qty;
            try {
                let newQ = Math.max(0, item.max_qty - item.qty);
                await supabaseClient.from("products").update({ quantity: newQ }).eq("id", item.id);
            } catch (e) { console.log(e); }
        }

        const invCode = `INV-${(invoicesList.length + 1).toString().padStart(3, '0')}`;
        const invData = {
            username: currentUser,
            invoice_code: invCode,
            customer_name: custName,
            products_text: prodStrList.join(" ، "),
            total_price: finalTotal,
            cost_price: totalCostInv,
            paid_amount: Math.min(paidVal, finalTotal),
            remaining_amount: remVal,
            payment_type: payStatus,
            created_date: new Date().toISOString().replace('T', ' ').substring(0, 16)
        };

        const { error } = await supabaseClient.from("invoices").insert([invData]);
        if (error) return;

        invoicesList.push(invData);
        cart = [];
        localStorage.removeItem("yasser_cart");
        goToPage('invoices');
    }

    function renderAddProduct(container) {
        document.getElementById("app-title").innerText = "إضافة مادة جديدة للمخزن";
        container.innerHTML = `
            <label>اسم المادة:</label>
            <input type="text" id="p-name" placeholder="أدخل اسم المادة...">
            <label>سعر الشراء:</label>
            <input type="number" id="p-buy" value="0">
            <label>سعر البيع:</label>
            <input type="number" id="p-sell" value="0">
            <label>الكمية المتوفرة:</label>
            <input type="number" id="p-qty" value="1">
            <button onclick="saveNewProduct()">حفظ المادة الجديدة</button>
        `;
    }

    async function saveNewProduct() {
        const name = document.getElementById("p-name").value.trim();
        const buy = parseFloat(document.getElementById("p-buy").value) || 0;
        const sell = parseFloat(document.getElementById("p-sell").value) || 0;
        const qty = parseInt(document.getElementById("p-qty").value) || 1;

        if (!name) return;
        const newP = { username: currentUser, product_name: name, buy_price: buy, sell_price: sell, quantity: qty, barcode: "بدون" };
        
        const { error } = await supabaseClient.from("products").insert([newP]).select();
        if (error) return;

        await loadAppData();
        goToPage('inventory');
    }

    function renderAddStock(container) {
        document.getElementById("app-title").innerText = "إضافة كمية لمادة مخزنة";
        container.innerHTML = `
            <label>اختر المادة:</label>
            <select id="stock-product-id">
                ${productsList.map(p => `<option value="${p.id}">📦 ${p.product_name} (المتوفر حالياً: ${p.quantity})</option>`).join('')}
            </select>
            <label>الكمية الإضافية المراد إضافتها:</label>
            <input type="number" id="stock-added-qty" value="1" min="1">
            <label>تحديث سعر البيع (اختياري):</label>
            <input type="number" id="stock-new-sell" placeholder="اتركه فارغاً أو ادرج السعر الجديد">
            <button onclick="saveAddedStock()" style="background:#2b6cb0;">➕ إضافة الكمية إلى رصيد المادة</button>
        `;
    }

    async function saveAddedStock() {
        const prodId = document.getElementById("stock-product-id").value;
        const addedQty = parseInt(document.getElementById("stock-added-qty").value) || 0;
        const newSellInput = document.getElementById("stock-new-sell").value;

        if (!prodId || addedQty <= 0) return;

        const currentProd = productsList.find(p => p.id == prodId);
        if (!currentProd) return;

        let updateData = { quantity: currentProd.quantity + addedQty };
        if (newSellInput !== "") {
            updateData.sell_price = parseFloat(newSellInput) || currentProd.sell_price;
        }

        const { error } = await supabaseClient.from("products").update(updateData).eq("id", prodId);
        if (error) return;

        await loadAppData();
        goToPage('inventory');
    }

    function renderInventory(container) {
        document.getElementById("app-title").innerText = "جرد المخزن الشامل";
        let html = `<table border="1" style="width:100%; border-collapse:collapse; font-size:12px; background:#fff; text-align:center;">
            <tr style="background:#f3e8ff;"><th>المادة</th><th>الشراء</th><th>البيع</th><th>الكمية</th></tr>`;
        productsList.forEach(p => {
            html += `<tr><td>${p.product_name}</td><td>${p.buy_price}</td><td>${p.sell_price}</td><td><b>${p.quantity}</b></td></tr>`;
        });
        html += `</table>`;
        container.innerHTML = html;
    }

    function renderCustomers(container) {
        document.getElementById("app-title").innerText = "إدارة العملاء والديون";
        container.innerHTML = `
            <label>اسم العميل:</label>
            <input type="text" id="c-name" placeholder="الاسم الكامل...">
            <label>رقم الهاتف:</label>
            <input type="text" id="c-phone" placeholder="رقم الهاتف...">
            <label>المحافظة:</label>
            <input type="text" id="c-gov" placeholder="المحافظة (مثال: البصرة)...">
            <label>الشارع:</label>
            <input type="text" id="c-street" placeholder="اسم الشارع...">
            <label>العنوان التفصيلي:</label>
            <input type="text" id="c-address" placeholder="رقم الدار / القريبة...">
            <button onclick="saveCustomer()">حفظ العميل الجديد</button>
            <hr>
            <h4>العملاء المسجلون:</h4>
            ${customersList.map(c => `<div class="card"><b>${c.customer_name}</b><br>📞 ${c.phone} | 📍 ${c.governorate} - ${c.street || ''} - ${c.address}</div>`).join('')}
        `;
    }

    async function saveCustomer() {
        const name = document.getElementById("c-name").value.trim();
        const phone = document.getElementById("c-phone").value.trim();
        const gov = document.getElementById("c-gov").value.trim();
        const street = document.getElementById("c-street").value.trim();
        const address = document.getElementById("c-address").value.trim();

        if (!name || !phone) return;
        const newC = { 
            username: currentUser, 
            customer_name: name, 
            phone: phone, 
            governorate: gov || "غير محدد", 
            street: street || "غير محدد", 
            address: address || "غير محدد" 
        };
        
        const { error } = await supabaseClient.from("customers").insert([newC]);
        if (error) return;

        await loadAppData();
        goToPage('customers');
    }

    function renderInvoices(container) {
        document.getElementById("app-title").innerText = "سجل الفواتير";
        let html = ``;
        invoicesList.slice().reverse().forEach((inv, idx) => {
            const invId = `invoice-card-${idx}`;
            const wText = encodeURIComponent(`فاتورة رقم ${inv.invoice_code} للزبون ${inv.customer_name}%0Aالمبلغ: ${inv.total_price.toLocaleString()} د.ع%0Aالمتبقي: ${inv.remaining_amount.toLocaleString()} د.ع`);
            html += `
                <div class="card" id="${invId}">
                    <b>فاتورة: ${inv.invoice_code}</b> | الزبون: ${inv.customer_name}
                    <p>التفاصيل: ${inv.products_text}</p>
                    <p>المجموع الكلي: <b>${inv.total_price.toLocaleString()}</b> د.ع | المتبقي: ${inv.remaining_amount.toLocaleString()} د.ع</p>
                    <p style="font-size:11px; color:#666;">الحالة: ${inv.payment_type} | التاريخ: ${inv.created_date}</p>
                    <button onclick="downloadPDF('${invId}', '${inv.invoice_code}')" style="background:#2b6cb0; margin-bottom:5px;">📥 تحميل الفاتورة PDF</button>
                    <a href="https://wa.me/?text=${wText}" target="_blank"><button style="background:#25D366; margin:0;">💬 إرسال عبر الواتساب</button></a>
                </div>
            `;
        });
        container.innerHTML = html || "<p style='text-align:center;'>لا توجد فواتير مسجلة.</p>";
    }

    function downloadPDF(elementId, invCode) {
        const element = document.getElementById(elementId);
        const opt = {
            margin:       10,
            filename:     `Invoice_${invCode}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().from(element).set(opt).save();
    }

    function renderReports(container) {
        document.getElementById("app-title").innerText = "التقارير والأرباح";
        const totalSales = invoicesList.reduce((sum, inv) => sum + inv.total_price, 0);
        container.innerHTML = `
            <div class="card" style="text-align:center;">
                <h3>إجمالي المبيعات العامة</h3>
                <h2>${totalSales.toLocaleString()} د.ع</h2>
            </div>
        `;
    }
</script>
