<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ياسر ويب - YASSER WEB</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: linear-gradient(135deg, #553c9a 0%, #3b2375 100%);
            direction: rtl;
            text-align: right;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .mobile-container {
            width: 100%;
            max-width: 420px;
            background: #f8f6fc;
            border-radius: 32px;
            padding: 25px 18px;
            margin: 15px auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            border: 6px solid #2d1a4e;
            box-sizing: border-box;
            color: #2d1a4e;
        }
        h1, h2, h3, h4, p, label { color: #2d1a4e; font-weight: 600; }
        input, select, textarea {
            color: #000000 !important;
            background: #ffffff !important;
            border: 1px solid #dcd6f7 !important;
            border-radius: 12px !important;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            text-align: right;
            direction: rtl;
            font-size: 14px;
        }
        button, .btn {
            background-color: #6b46c1;
            color: white;
            border-radius: 12px;
            border: none;
            padding: 10px 14px;
            font-weight: bold;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        button:hover { background-color: #483185; }
        .card {
            background: #ffffff;
            border: 1px solid #e2d9f3;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .product-img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background-color: #f8f6fc;
            border-radius: 10px;
            margin-bottom: 8px;
            display: block;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2d9f3;
            padding-bottom: 10px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="mobile-container" id="app">
    <div id="loading-screen" style="text-align: center; padding: 50px 0;">
        <h3>جاري تحميل نظام ياسر ويب النسخة الجديدة...</h3>
    </div>

    <div id="main-app" class="hidden">
        <div class="top-bar">
            <button id="back-btn" class="hidden" onclick="goToPage('home')" style="width: auto; padding: 6px 12px;">⬅️ رجوع</button>
            <span id="app-title" style="font-weight: bold; font-size: 15px;">ياسر ويب</span>
            <button onclick="goToPage('home')" style="width: auto; padding: 6px 12px; background: #c53030;">الرئيسية</button>
        </div>
        <div id="view-content"></div>
    </div>
</div>

<script>
    let productsList = [
        { product_name: "تجربة مادة", sell_price: 5000, quantity: 10, image_url: "" }
    ];

    window.onload = () => {
        document.getElementById("loading-screen").classList.add("hidden");
        document.getElementById("main-app").classList.remove("hidden");
        goToPage("home");
    };

    function goToPage(page) {
        const content = document.getElementById("view-content");
        const backBtn = document.getElementById("back-btn");
        
        if (page === "home") {
            backBtn.classList.add("hidden");
            document.getElementById("app-title").innerText = "ياسر ويب - الرئيسية";
            content.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="card" onclick="goToPage('grid')" style="cursor:pointer; text-align:center;">
                        <h4>🏠 شبكة المواد (مع الصور)</h4>
                    </div>
                    <div class="card" onclick="goToPage('add_product')" style="cursor:pointer; text-align:center;">
                        <h4>➕ إضافة مادة جديدة</h4>
                    </div>
                    <div class="card" onclick="goToPage('admin_panel')" style="cursor:pointer; text-align:center; background:#fff5f5; grid-column: span 2;">
                        <h4 style="color:#c53030;">👑 لوحة الأدمن (أكواد 30 و 10 أيام)</h4>
                    </div>
                </div>
            `;
        } else if (page === "grid") {
            backBtn.classList.remove("hidden");
            document.getElementById("app-title").innerText = "شبكة المواد السريعة";
            let html = `<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">`;
            productsList.forEach(item => {
                let img = item.image_url ? item.image_url : "https://via.placeholder.com/150?text=لا+توجد+صورة";
                html += `
                    <div class="card" style="text-align:center; margin-bottom:0;">
                        <img src="${img}" class="product-img">
                        <h4 style="margin:5px 0;">📦 ${item.product_name}</h4>
                        <p style="margin:2px 0; font-size:12px;">السعر: <b>${item.sell_price}</b> د.ع</p>
                    </div>
                `;
            });
            html += `</div>`;
            content.innerHTML = html;
        } else if (page === "add_product") {
            backBtn.classList.remove("hidden");
            document.getElementById("app-title").innerText = "إضافة مادة جديدة";
            content.innerHTML = `
                <div class="card">
                    <label>اسم المادة:</label>
                    <input type="text" id="p-name" placeholder="أدخل اسم المادة...">
                    
                    <label>📷 صورة المادة (اختر ملف أو ضع رابط):</label>
                    <input type="file" id="p-file" accept="image/*" onchange="handleImg(event)">
                    <input type="text" id="p-img" placeholder="أو ضع رابط الصورة هنا...">

                    <label>سعر البيع:</label>
                    <input type="number" id="p-sell" placeholder="0">

                    <button onclick="saveProd()" style="background:#2f855a;">حفظ المادة</button>
                </div>
            `;
        } else if (page === "admin_panel") {
            backBtn.classList.remove("hidden");
            document.getElementById("app-title").innerText = "لوحة الأدمن للأكواد";
            content.innerHTML = `
                <div class="card">
                    <h3 style="color:#c53030; margin-top:0;">توليد أكواد الاشتراك</h3>
                    <label>اختر مدة الكود:</label>
                    <select id="code-days">
                        <option value="30">اشتراك 30 يوم (شهر)</option>
                        <option value="10">اشتراك 10 أيام</option>
                    </select>
                    <button onclick="genCod()" style="background:#c53030;">توليد الكود</button>
                    <p id="res-code" style="font-weight:bold; color:#2f855a; text-align:center; margin-top:10px;"></p>
                </div>
            `;
        }
    }

    function handleImg(e) {
        const f = e.target.files[0];
        if (f) {
            const r = new FileReader();
            r.onload = function(ev) {
                document.getElementById("p-img").value = ev.target.result;
            };
            r.readAsDataURL(f);
        }
    }

    function saveProd() {
        let name = document.getElementById("p-name").value;
        let img = document.getElementById("p-img").value;
        let sell = document.getElementById("p-sell").value;
        if (!name) { alert("أدخل اسم المادة"); return; }
        productsList.push({ product_name: name, sell_price: Number(sell), quantity: 5, image_url: img });
        alert("تمت الإضافة بنجاح!");
        goToPage("grid");
    }

    function genCod() {
        let d = document.getElementById("code-days").value;
        let code = `YASSER-${d}D-${Math.floor(1000 + Math.random() * 9000)}`;
        document.getElementById("res-code").innerText = `الكود المولد (${d} يوم): ${code}`;
    }
</script>
</body>
</html>
