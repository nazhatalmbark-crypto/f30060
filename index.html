<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ياسر ويب - YASSER WEB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: linear-gradient(135deg, #553c9a 0%, #3b2375 100%);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .mobile-container {
            max-width: 420px;
            background: #f8f6fc;
            border-radius: 32px;
            padding: 20px 15px;
            margin: 10px auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            border: 6px solid #2d1a4e;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="mobile-container" id="app">
        <div id="main-content">
            <div class="text-center py-20 text-purple-900 font-bold">جاري تحميل نظام ياسر ويب...</div>
        </div>

        <footer class="text-center text-xs text-purple-400 mt-4">
            ياسر ويب - الإصدار 4.4.0 (Static Web)
        </footer>
    </div>

    <script>
        const SUPABASE_URL = "https://mdffzniutjcjnytuoakb.supabase.co";
        const SUPABASE_KEY = "sb_publishable_PjzQyJU_n-4pFdLZV7os6w_gLt78fLp";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let state = {
            user: localStorage.getItem('yasser_user') || null,
            role: localStorage.getItem('yasser_role') || 'مشرف النظام',
            page: 'main',
            products: [],
            customers: [],
            cart: [],
            invoices: [],
            expenses: []
        };

        async function init() {
            if (state.user) {
                await loadUserData();
            }
            render();
        }

        async function loadUserData() {
            try {
                const pRes = await supabase.from('products').select('*').eq('username', state.user);
                if (pRes.data) state.products = pRes.data;

                const cRes = await supabase.from('customers').select('*').eq('username', state.user);
                if (cRes.data) state.customers = cRes.data;

                const iRes = await supabase.from('invoices').select('*').eq('username', state.user);
                if (iRes.data) state.invoices = iRes.data;
            } catch (e) {
                console.error(e);
            }
        }

        function render() {
            const container = document.getElementById('main-content');
            
            if (!state.user) {
                container.innerHTML = `
                    <div class="py-10">
                        <h2 class="text-center text-lg font-bold text-purple-950 mb-6">🔐 تسجيل الدخول لنظام (ياسر ويب)</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-purple-900 mb-1">اسم المستخدم أو المحل:</label>
                                <input type="text" id="login-username" class="w-full p-3 bg-white border border-purple-200 rounded-xl text-black text-right" placeholder="أدخل اسم المحل">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-purple-900 mb-1">الصلاحية:</label>
                                <select id="login-role" class="w-full p-3 bg-white border border-purple-200 rounded-xl text-black text-right">
                                    <option>مشرف النظام</option>
                                    <option>كاشير</option>
                                    <option>مسؤول مبيعات</option>
                                </select>
                            </div>
                            <button onclick="handleLogin()" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold p-3 rounded-xl shadow-lg">دخول للنظام</button>
                        </div>
                    </div>
                `;
                return;
            }

            let topBar = `
                <div class="flex justify-between items-center pb-3 border-b border-purple-200 mb-4">
                    ${state.page !== 'main' ? `<button onclick="navigate('main')" class="bg-purple-200 text-purple-900 px-3 py-1 rounded-lg text-sm font-bold">⬅️ رجوع</button>` : '<div></div>'}
                    <button onclick="navigate('cart')" class="bg-purple-700 text-white px-3 py-1 rounded-lg text-sm font-bold">🛒 السلة [${state.cart.reduce((a,b)=>a+b.qty,0)}]</button>
                    <button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm font-bold">🚪 خروج</button>
                </div>
                <h3 class="text-center font-bold text-purple-950 text-base mb-3">ياسر ويب (${state.user})</h3>
            `;

            let content = '';

            if (state.page === 'main') {
                const todayStr = new Date().toISOString().split('T')[0];
                const todayInvs = state.invoices.filter(i => String(i.created_date).startsWith(todayStr));
                const todaySales = todayInvs.reduce((sum, inv) => sum + Number(inv.total_price || 0), 0);

                content = `
                    <div class="bg-white p-3 rounded-2xl shadow mb-4 text-center border border-purple-100">
                        <p class="text-xs font-bold text-purple-900">📊 إحصائيات اليوم: مبيعات: <span class="text-purple-700">${todaySales.toLocaleString()} د.ع</span> | الفواتير: ${todayInvs.length}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="navigate('grid')" class="bg-white p-4 rounded-2xl shadow border border-purple-100 text-center hover:bg-purple-50">
                            <div class="text-xl mb-1">🏠</div>
                            <div class="font-bold text-purple-950 text-sm">الرئيسية والشبكة</div>
                            <div class="text-[11px] text-purple-600">عرض المواد والبيع السريع</div>
                        </button>
                        <button onclick="navigate('add_product')" class="bg-white p-4 rounded-2xl shadow border border-purple-100 text-center hover:bg-purple-50">
                            <div class="text-xl mb-1">➕</div>
                            <div class="font-bold text-purple-950 text-sm">إضافة وتوريد</div>
                            <div class="text-[11px] text-purple-600">إضافة بضاعة ومخزون</div>
                        </button>
                        <button onclick="navigate('inventory')" class="bg-white p-4 rounded-2xl shadow border border-purple-100 text-center hover:bg-purple-50">
                            <div class="text-xl mb-1">📦</div>
                            <div class="font-bold text-purple-950 text-sm">جرد المخزن</div>
                            <div class="text-[11px] text-purple-600">رصيد المواد</div>
                        </button>
                        <button onclick="navigate('customers')" class="bg-white p-4 rounded-2xl shadow border border-purple-100 text-center hover:bg-purple-50">
                            <div class="text-xl mb-1">👥</div>
                            <div class="font-bold text-purple-950 text-sm">العملاء والديون</div>
                            <div class="text-[11px] text-purple-600">إدارة الزبائن والذمم</div>
                        </button>
                        <button onclick="navigate('invoices')" class="bg-white p-4 rounded-2xl shadow border border-purple-100 text-center hover:bg-purple-50">
                            <div class="text-xl mb-1">📄</div>
                            <div class="font-bold text-purple-950 text-sm">سجل الفواتير</div>
                            <div class="text-[11px] text-purple-600">قائمة الفواتير والواتساب</div>
                        </button>
                        <button onclick="navigate('expenses')" class="bg-white p-4 rounded-2xl shadow border border-purple-100 text-center hover:bg-purple-50">
                            <div class="text-xl mb-1">💰</div>
                            <div class="font-bold text-purple-950 text-sm">الصندوق والمصاريف</div>
                            <div class="text-[11px] text-purple-600">سندات المصروفات</div>
                        </button>
                    </div>
                `;
            } else if (state.page === 'grid') {
                content = `
                    <h4 class="font-bold text-purple-950 mb-3">🏠 شبكة المبيعات</h4>
                    <input type="text" id="search-prod" oninput="filterProducts(this.value)" placeholder="🔍 بحث سريع عن مادة..." class="w-full p-2 bg-white border border-purple-200 rounded-xl mb-3 text-right text-sm">
                    <div id="products-grid" class="grid grid-cols-2 gap-2 max-h-[60vh] overflow-y-auto">
                        ${renderProductsGrid()}
                    </div>
                `;
            } else if (state.page === 'cart') {
                let totalCart = state.cart.reduce((sum, item) => sum + (item.sell_price * item.qty), 0);
                content = `
                    <h4 class="font-bold text-purple-950 mb-3">🛒 سلة البيع وإتمام الفاتورة</h4>
                    <div class="space-y-2 max-h-[40vh] overflow-y-auto mb-3">
                        ${state.cart.length === 0 ? '<p class="text-center text-xs text-purple-700">السلة فارغة</p>' : state.cart.map((item, idx) => `
                            <div class="bg-white p-2 rounded-xl shadow border border-purple-100 text-xs flex justify-between items-center">
                                <div>
                                    <div class="font-bold text-purple-950">${item.product_name}</div>
                                    <div class="text-purple-700">${item.sell_price.toLocaleString()} د.ع × ${item.qty}</div>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="updateCartQty(${idx}, 1)" class="bg-purple-200 px-2 py-1 rounded font-bold">+</button>
                                    <span>${item.qty}</span>
                                    <button onclick="updateCartQty(${idx}, -1)" class="bg-purple-200 px-2 py-1 rounded font-bold">-</button>
                                    <button onclick="removeFromCart(${idx})" class="text-red-500 font-bold px-1">🗑️</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="bg-purple-100 p-3 rounded-xl mb-3 font-bold text-purple-950 text-sm flex justify-between">
                        <span>المجموع الكلي:</span>
                        <span>${totalCart.toLocaleString()} د.ع</span>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-purple-900">اختر العميل:</label>
                        <select id="checkout-customer" class="w-full p-2 bg-white border rounded-xl text-xs">
                            ${state.customers.map(c => `<option value="${c.customer_name}">${c.customer_name} (${c.phone || 'بدون هاتف'})</option>`).join('')}
                        </select>
                        <label class="block text-xs font-bold text-purple-900">المبلغ الواصل (نقد):</label>
                        <input type="number" id="paid-amount" value="${totalCart}" class="w-full p-2 bg-white border rounded-xl text-xs text-right">
                        <button onclick="completeCheckout(${totalCart})" class="w-full bg-purple-700 text-white p-3 rounded-xl font-bold text-sm shadow">💾 إتمام وحفظ البيع وطباعة الفاتورة</button>
                    </div>
                `;
            } else if (state.page === 'add_product') {
                content = `
                    <h4 class="font-bold text-purple-950 mb-3">➕ إضافة مادة جديدة</h4>
                    <div class="space-y-3 text-xs">
                        <div><label class="font-bold text-purple-900">اسم المادة:</label><input type="text" id="p-name" class="w-full p-2 bg-white border rounded-xl mt-1"></div>
                        <div><label class="font-bold text-purple-900">سعر الشراء:</label><input type="number" id="p-buy" value="0" class="w-full p-2 bg-white border rounded-xl mt-1"></div>
                        <div><label class="font-bold text-purple-900">سعر البيع:</label><input type="number" id="p-sell" value="0" class="w-full p-2 bg-white border rounded-xl mt-1"></div>
                        <div><label class="font-bold text-purple-900">الكمية المتوفرة:</label><input type="number" id="p-qty" value="1" class="w-full p-2 bg-white border rounded-xl mt-1"></div>
                        <button onclick="saveNewProduct()" class="w-full bg-purple-700 text-white p-3 rounded-xl font-bold shadow">حفظ المادة في المخزن</button>
                    </div>
                `;
            } else if (state.page === 'inventory') {
                content = `
                    <h4 class="font-bold text-purple-950 mb-3">📦 جرد المخزن الشامل</h4>
                    <div class="space-y-2 max-h-[60vh] overflow-y-auto text-xs">
                        ${state.products.length === 0 ? '<p class="text-center text-purple-700">المخزن فارغ حالياً.</p>' : state.products.map(p => `
                            <div class="bg-white p-3 rounded-xl shadow border border-purple-100 flex justify-between items-center">
                                <div>
                                    <div class="font-bold text-purple-950 text-sm">${p.product_name}</div>
                                    <div class="text-purple-700">شراء: ${p.buy_price} | بيع: ${p.sell_price}</div>
                                </div>
                                <div class="bg-purple-100 px-3 py-1 rounded-lg font-bold text-purple-900">
                                    ${p.quantity} قطعة
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (state.page === 'customers') {
                content = `
                    <h4 class="font-bold text-purple-950 mb-3">👥 إدارة العملاء والذمم</h4>
                    <div class="space-y-2 text-xs mb-4">
                        <input type="text" id="c-name" placeholder="اسم العميل" class="w-full p-2 bg-white border rounded-xl">
                        <input type="text" id="c-phone" placeholder="رقم الهاتف" class="w-full p-2 bg-white border rounded-xl">
                        <input type="text" id="c-address" placeholder="العنوان" class="w-full p-2 bg-white border rounded-xl">
                        <button onclick="saveNewCustomer()" class="w-full bg-purple-700 text-white p-2.5 rounded-xl font-bold">حفظ العميل الجديد</button>
                    </div>
                    <div class="space-y-2 max-h-[30vh] overflow-y-auto text-xs">
                        ${state.customers.map(c => `
                            <div class="bg-white p-2 rounded-xl shadow border border-purple-100">
                                <div class="font-bold text-purple-950">${c.customer_name}</div>
                                <div class="text-purple-700">📞 ${c.phone || 'بدون'} | 📍 ${c.address || 'بدون'}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (state.page === 'invoices') {
                content = `
                    <h4 class="font-bold text-purple-950 mb-3">📄 سجل الفواتير الرسمية</h4>
                    <div class="space-y-2 max-h-[60vh] overflow-y-auto text-xs">
                        ${state.invoices.length === 0 ? '<p class="text-center text-purple-700">لا توجد فواتير مسجلة.</p>' : state.invoices.map(inv => `
                            <div class="bg-white p-3 rounded-xl shadow border border-purple-100">
                                <div class="flex justify-between font-bold text-purple-950 mb-1">
                                    <span>فاتورة: ${inv.invoice_code}</span>
                                    <span>${inv.total_price.toLocaleString()} د.ع</span>
                                </div>
                                <div class="text-purple-700 mb-2">الزبون: ${inv.customer_name} | التاريخ: ${inv.created_date}</div>
                                <a href="https://wa.me/?text=${encodeURIComponent('فاتورة رقم ' + inv.invoice_code + ' للزبون ' + inv.customer_name + ' المبلغ: ' + inv.total_price + ' د.ع')}" target="_blank" class="block bg-green-600 text-white text-center py-1.5 rounded-lg font-bold">💬 إرسال عبر الواتساب</a>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (state.page === 'expenses') {
                content = `
                    <h4 class="font-bold text-purple-950 mb-3">💰 صندوق الوردية والمصاريف</h4>
                    <div class="space-y-2 text-xs mb-3">
                        <input type="text" id="exp-desc" placeholder="بيان المصروف" class="w-full p-2 bg-white border rounded-xl">
                        <input type="number" id="exp-amount" placeholder="المبلغ (د.ع)" class="w-full p-2 bg-white border rounded-xl">
                        <button onclick="saveExpense()" class="w-full bg-purple-700 text-white p-2.5 rounded-xl font-bold">تسجيل المصروف</button>
                    </div>
                    <div class="space-y-1 text-xs">
                        ${state.expenses.map(e => `
                            <div class="bg-white p-2 rounded-xl shadow flex justify-between">
                                <span>${e.desc}</span>
                                <span class="font-bold text-red-600">${e.amount.toLocaleString()} د.ع</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            container.innerHTML = topBar + content;
        }

        function navigate(page) {
            state.page = page;
            render();
        }

        async function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const role = document.getElementById('login-role').value;
            if (!username) {
                alert('يرجى إدخال اسم المستخدم');
                return;
            }
            state.user = username;
            state.role = role;
            localStorage.setItem('yasser_user', username);
            localStorage.setItem('yasser_role', role);

            try {
                await supabase.from('users').upsert({ username: username, is_paid: false });
            } catch (e) {}

            await loadUserData();
            state.page = 'main';
            render();
        }

        function handleLogout() {
            state.user = null;
            state.cart = [];
            localStorage.removeItem('yasser_user');
            render();
        }

        function renderProductsGrid(filter = '') {
            const filtered = state.products.filter(p => p.product_name.toLowerCase().includes(filter.toLowerCase()));
            if (filtered.length === 0) return '<p class="col-span-2 text-center text-xs text-purple-700">لا توجد مواد مطابقة.</p>';
            
            return filtered.map(p => `
                <div class="bg-white p-3 rounded-xl shadow border border-purple-100 flex flex-col justify-between">
                    <div>
                        <div class="font-bold text-purple-950 text-xs mb-1">📦 ${p.product_name}</div>
                        <div class="text-purple-700 text-[11px] mb-1">السعر: ${p.sell_price.toLocaleString()} د.ع</div>
                        <div class="text-purple-600 text-[10px] mb-2">المتوفر: ${p.quantity} قطعة</div>
                    </div>
                    <button onclick="addToCart('${p.id}')" class="w-full bg-purple-700 text-white py-1 rounded-lg text-xs font-bold">➕ إضافة</button>
                </div>
            `).join('');
        }

        function filterProducts(val) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = renderProductsGrid(val);
        }

        function addToCart(id) {
            const product = state.products.find(p => p.id == id);
            if (!product || product.quantity <= 0) {
                alert('المادة غير متوفرة');
                return;
            }
            const existing = state.cart.find(item => item.id == id);
            if (existing) {
                if (existing.qty < product.quantity) {
                    existing.qty++;
                } else {
                    alert('الكمية المطلوبة تتجاوز المتوفر في المخزن');
                    return;
                }
            } else {
                state.cart.push({ ...product, qty: 1 });
            }
            alert('تمت الإضافة للسلة!');
            render();
        }

        function updateCartQty(idx, change) {
            state.cart[idx].qty += change;
            if (state.cart.qty <= 0) {
                state.cart.splice(idx, 1);
            }
            render();
        }

        function removeFromCart(idx) {
            state.cart.splice(idx, 1);
            render();
        }

        async function completeCheckout(totalCart) {
            const customerName = document.getElementById('checkout-customer').value;
            const paidAmount = parseFloat(document.getElementById('paid-amount').value) || 0;
            const remaining = Math.max(0, totalCart - paidAmount);

            if (!customerName) {
                alert('يرجى اختيار عميل');
                return;
            }

            const invCode = 'INV-' + String(state.invoices.length + 1).padStart(3, '0');
            const productsText = state.cart.map(i => `${i.product_name} [العدد: ${i.qty}]`).join('، ');
            const costPrice = state.cart.reduce((sum, i) => sum + (i.buy_price * i.qty), 0);

            const invData = {
                username: state.user,
                invoice_code: invCode,
                customer_name: customerName,
                products_text: productsText,
                total_price: totalCart,
                cost_price: costPrice,
                paid_amount: paidAmount,
                remaining_amount: remaining,
                payment_type: paidAmount >= totalCart ? '🟢 نقد (كاش)' : '🔵 دفعة جزئية',
                created_date: new Date().toISOString().slice(0, 16).replace('T', ' ')
            };

            try {
                await supabase.from('invoices').insert([invData]);
                for (let item of state.cart) {
                    const newQty = Math.max(0, item.quantity - item.qty);
                    await supabase.from('products').update({ quantity: newQty }).eq('id', item.id);
                }
                state.invoices.push(invData);
                state.cart = [];
                alert('✅ تمت عملية البيع بنجاح!');
                navigate('invoices');
            } catch (e) {
                alert('خطأ أثناء الحفظ: ' + e.message);
            }
        }

        async function saveNewProduct() {
            const name = document.getElementById('p-name').value.trim();
            const buy = parseFloat(document.getElementById('p-buy').value) || 0;
            const sell = parseFloat(document.getElementById('p-sell').value) || 0;
            const qty = parseInt(document.getElementById('p-qty').value) || 1;

            if (!name) {
                alert('يرجى إدخال اسم المادة');
                return;
            }

            const newProd = { username: state.user, product_name: name, buy_price: buy, sell_price: sell, quantity: qty, barcode: 'بدون' };
            try {
                const res = await supabase.from('products').insert([newProd]).select();
                if (res.data) state.products.push(res.data[0]);
                alert('تم حفظ المادة بنجاح!');
                navigate('inventory');
            } catch (e) {
                alert('خطأ: ' + e.message);
            }
        }

        async function saveNewCustomer() {
            const name = document.getElementById('c-name').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            const address = document.getElementById('c-address').value.trim();

            if (!name) {
                alert('يرجى إدخال اسم العميل');
                return;
            }

            const newCust = { username: state.user, customer_name: name, phone: phone, address: address };
            try {
                const res = await supabase.from('customers').insert([newCust]).select();
                if (res.data) state.customers.push(res.data[0]);
                alert('تم حفظ العميل بنجاح!');
                render();
            } catch (e) {
                alert('خطأ: ' + e.message);
            }
        }

        function saveExpense() {
            const desc = document.getElementById('exp-desc').value.trim();
            const amount = parseFloat(document.getElementById('exp-amount').value) || 0;
            if (!desc) return;
            state.expenses.push({ desc, amount });
            alert('تم تسجيل المصروف');
            render();
        }

        window.onload = init;
    </script>
</body>
</html>
